<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F3F4F1" />
    <meta name="author" content="Shubham Nagar" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- seo -->
    <!-- Replaced per page at build time by scripts/prerender.mjs (from src/lib/seo.js).
         These defaults only show in `npm run dev`. -->
    <title>Shubham Nagar · Designer & developer in Indore</title>
    <meta name="description" content="One person for your whole online presence: website, SEO, presentations, video and social. Based in Indore. Every project starts with a free working preview." />
    <!-- /seo -->

    <!-- Apply saved theme before first paint so there is no light/dark flash -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>

    <!-- Without JavaScript, content waiting for its entrance animation is shown straight away.
         Decorative layers (page curtains, blobs, highlights) are aria-hidden and keep their resting state. -->
    <noscript>
      <style>
        #root [style*="opacity:0"]:not([aria-hidden="true"]) { opacity: 1 !important; }
        #root [style*="transform"]:not([aria-hidden="true"]) { transform: none !important; }
        #root [style*="clip-path"]:not([aria-hidden="true"]) { clip-path: none !important; }
        #root img { opacity: 1 !important; }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
